<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#08777d" />
    <title>TicTide Offline</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f7fbfa;
        --ink: #102629;
        --muted: #63777a;
        --teal: #08777d;
        --teal-soft: #dff5f3;
        --gold-soft: #fff3cf;
      }
      * { box-sizing: border-box; }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 20px;
        color: var(--ink);
        background:
          linear-gradient(135deg, rgba(8, 119, 125, 0.1), transparent 38%),
          linear-gradient(180deg, rgba(255, 243, 207, 0.56), transparent 58%),
          var(--bg);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main {
        width: min(560px, 100%);
        padding: 22px;
        border: 1px solid rgba(8, 119, 125, 0.14);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.94);
        box-shadow: 0 20px 60px rgba(29, 74, 73, 0.12);
      }
      .brand {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        color: #064f54;
        font-weight: 850;
      }
      .brand img {
        width: 34px;
        height: 34px;
        border-radius: 8px;
      }
      .hero {
        margin-top: 18px;
        padding: 18px;
        border-radius: 8px;
        background: linear-gradient(135deg, var(--teal-soft), var(--gold-soft));
      }
      h1 {
        margin: 0;
        font-size: clamp(2rem, 8vw, 3rem);
        line-height: 1.04;
      }
      p {
        margin: 12px 0 0;
        color: var(--muted);
        font-size: 1rem;
        line-height: 1.5;
      }
      button {
        width: 100%;
        min-height: 48px;
        margin-top: 18px;
        border: 0;
        border-radius: 8px;
        color: white;
        background: var(--teal);
        font: inherit;
        font-weight: 800;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="brand">
        <img src="/icon.svg" alt="" />
        <span>TicTide</span>
      </div>
      <section class="hero">
        <h1>You are offline</h1>
        <p>TicTide can keep working after it has loaded once. Reopen the app or try again when your connection comes back.</p>
      </section>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
